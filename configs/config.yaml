# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cuda

ingest:
  source_pdf: data/raw/pierce-peoples-common-sense-medical-adviser-1890.pdf
  doc_id: pierce-1890
  output_dir: data/processed/pages         # loader appends doc_id and render settings
  dpi: 300
  format: jpeg
  quality: 80                     # deterministic RGB JPEG quality (1-100)
  page_limit: null                 # optional positive integer for bounded smoke runs

preprocess: {enabled: false, mode: "identity"}                         # measured baseline: preserve loader images
enhance:    {enabled: false, model: "none", type: "none"}              # enhancement is optional and not yet measured
layout:     {model: "projection", mode: "projection", score_thr: 0.5, blocks_path: null, missing_pages: "projection"}
ocr:        {model: "tesseract5", mode: "tesseract", lang: "eng", tesseract_config: "--psm 6", finetune: false}
embed:     {model: "sentence-transformers/all-MiniLM-L6-v2", dim: 384}
index:     {type: "faiss:hnsw", path: "data/processed/index", chunk_tokens: 256, overlap: 32, hnsw_m: 32}
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"}   # k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
